name: Deploy to Environment
# Automatic deployments:
# - Push to develop -> DIT (1 replica, SNAPSHOT versions allowed)
# - GitHub Release  -> SIT (2 replicas, RELEASE versions only)
#
# Build & publish happens on the self-hosted runner (Java/Maven/ECR).
# Deployment runs via SSH on the remote EC2 server defined by SSH_HOST.
on:
  push:
    branches:
      - develop
  release:
    types: [published]
permissions:
  contents: read
jobs:
  # ----------------------------------------------------------------------------
  # Job 1: Determine Target Environment
  # ----------------------------------------------------------------------------
  determine-env:
    name: Determine target environment
    runs-on: ubuntu-latest
    outputs:
      env: ${{ steps.set-env.outputs.env }}
      replicas: ${{ steps.set-env.outputs.replicas }}
      is_release: ${{ steps.set-env.outputs.is_release }}
      release_tag: ${{ steps.set-env.outputs.release_tag }}
    steps:
      - name: Set environment and replica count
        id: set-env
        run: |
          EVENT="${{ github.event_name }}"
          if [[ "${EVENT}" == "push" ]]; then
            BRANCH="${{ github.ref_name }}"
            if [[ "${BRANCH}" == "develop" ]]; then
              echo "env=dit" >> "$GITHUB_OUTPUT"
              echo "replicas=1" >> "$GITHUB_OUTPUT"
              echo "is_release=false" >> "$GITHUB_OUTPUT"
              echo "release_tag=" >> "$GITHUB_OUTPUT"
              echo "[INFO] Push to develop -> Auto-deploy to DIT (1 replica, SNAPSHOT allowed)"
            else
              echo "[ERROR] Unsupported branch: ${BRANCH}"
              exit 1
            fi
          elif [[ "${EVENT}" == "release" ]]; then
            RELEASE_TAG="${{ github.event.release.tag_name }}"
            echo "env=sit" >> "$GITHUB_OUTPUT"
            echo "replicas=2" >> "$GITHUB_OUTPUT"
            echo "is_release=true" >> "$GITHUB_OUTPUT"
            echo "release_tag=${RELEASE_TAG}" >> "$GITHUB_OUTPUT"
            echo "[INFO] GitHub Release ${RELEASE_TAG} -> Auto-deploy to SIT (2 replicas, RELEASE only)"
          else
            echo "[ERROR] Unsupported event: ${EVENT}"
            exit 1
          fi
  # ----------------------------------------------------------------------------
  # Job 2: Build, Publish (on self-hosted runner)
  # ----------------------------------------------------------------------------
  build-and-publish:
    name: Build -> Publish
    needs: determine-env
    runs-on: [self-hosted, linux, ap-south-1]
    environment: ${{ needs.determine-env.outputs.env }}
    env:
      ENV: ${{ needs.determine-env.outputs.env }}
    outputs:
      env:           ${{ needs.determine-env.outputs.env }}
      image_tag:     ${{ steps.meta.outputs.image_tag }}
      ecr_repo:      ${{ steps.meta.outputs.ecr_repo }}
      version:       ${{ steps.meta.outputs.version }}
      replicas:      ${{ needs.determine-env.outputs.replicas }}
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set JAVA_HOME to Corretto 25
        run: |
          for candidate in /usr/lib/jvm/java-25-amazon-corretto \
                           /usr/lib/jvm/java-25-amazon-corretto.x86_64 \
                           /opt/java/25; do
            if [ -x "${candidate}/bin/java" ]; then
              JAVA_HOME="${candidate}"
              break
            fi
          done
          echo "JAVA_HOME=${JAVA_HOME}" >> "$GITHUB_ENV"
          echo "PATH=${JAVA_HOME}/bin:$PATH" >> "$GITHUB_ENV"
          echo "[INFO] JAVA_HOME set to ${JAVA_HOME}"
          ${JAVA_HOME}/bin/java -version

      - name: Fetch CodeArtifact auth token
        id: codeartifact
        env:
          CODEARTIFACT_DOMAIN: ${{ vars.CODEARTIFACT_DOMAIN }}
          CODEARTIFACT_OWNER:  ${{ vars.CODEARTIFACT_OWNER }}
          AWS_REGION:          ${{ vars.AWS_REGION }}
        run: |
          set -euo pipefail
          [ -n "${CODEARTIFACT_DOMAIN:-}" ] || { echo "[ERROR] Missing repository variable: CODEARTIFACT_DOMAIN"; exit 1; }
          [ -n "${AWS_REGION:-}" ]          || { echo "[ERROR] Missing repository variable: AWS_REGION"; exit 1; }
          DOMAIN_OWNER="${CODEARTIFACT_OWNER:-}"
          if [ -z "${DOMAIN_OWNER}" ]; then
            DOMAIN_OWNER=$(aws sts get-caller-identity --query Account --output text)
          fi
          case "${DOMAIN_OWNER}" in
            [0-9][0-9][0-9][0-9][0-9][0-9][0-9][0-9][0-9][0-9][0-9][0-9]) ;;
            *) echo "[ERROR] Invalid domain owner: '${DOMAIN_OWNER}'"; exit 1 ;;
          esac
          TOKEN=$(aws codeartifact get-authorization-token \
            --domain "${CODEARTIFACT_DOMAIN}" \
            --domain-owner "${DOMAIN_OWNER}" \
            --region "${AWS_REGION}" \
            --query authorizationToken \
            --output text)
          [ -n "${TOKEN:-}" ] || { echo "[ERROR] Failed to fetch CodeArtifact token"; exit 1; }
          echo "domain_owner=${DOMAIN_OWNER}" >> "$GITHUB_OUTPUT"
          echo "token=${TOKEN}"               >> "$GITHUB_OUTPUT"

      - name: Extract Maven version and validate
        id: meta
        env:
          CODEARTIFACT_AUTH_TOKEN: ${{ steps.codeartifact.outputs.token }}
          CODEARTIFACT_DOMAIN:     ${{ vars.CODEARTIFACT_DOMAIN }}
          CODEARTIFACT_OWNER:      ${{ steps.codeartifact.outputs.domain_owner }}
          AWS_REGION:              ${{ vars.AWS_REGION }}
          IS_RELEASE:              ${{ needs.determine-env.outputs.is_release }}
          RELEASE_TAG:             ${{ needs.determine-env.outputs.release_tag }}
        run: |
          set -euo pipefail
          if [[ "${IS_RELEASE}" == "true" ]]; then
            VERSION="${RELEASE_TAG}"
            VERSION="${VERSION#v}"
            echo "[INFO] Using release tag as version: ${VERSION}"
          else
            VERSION=$(mvn help:evaluate -Dexpression=project.version -q -DforceStdout \
              --settings .mvn/settings.xml)
            echo "[INFO] Detected version from pom.xml: ${VERSION}"
          fi
          if [[ "${ENV}" == "sit" ]]; then
            if [[ "${VERSION}" =~ SNAPSHOT ]]; then
              echo "[ERROR] SIT environment does not allow SNAPSHOT versions"
              exit 1
            fi
            echo "[INFO] Release version detected: ${VERSION}"
          else
            echo "[INFO] Version for DIT: ${VERSION}"
          fi
          if [[ "${VERSION}" =~ SNAPSHOT ]]; then
            REPO="af-snapshots"
          else
            REPO="af-releases"
          fi
          echo "image_tag=${VERSION}"                                   >> "$GITHUB_OUTPUT"
          echo "ecr_repo=${{ vars.ECR_REGISTRY }}/af-novadesk-api"    >> "$GITHUB_OUTPUT"
          echo "version=${VERSION}"                                   >> "$GITHUB_OUTPUT"
          echo "codeartifact_repo=${REPO}"                            >> "$GITHUB_OUTPUT"
          echo "[INFO] Version: ${VERSION} | Repo: ${REPO} | Tag: ${ENV}-${VERSION}"

      - name: Maven build and test
        env:
          CODEARTIFACT_AUTH_TOKEN: ${{ steps.codeartifact.outputs.token }}
          CODEARTIFACT_DOMAIN:     ${{ vars.CODEARTIFACT_DOMAIN }}
          CODEARTIFACT_OWNER:      ${{ steps.codeartifact.outputs.domain_owner }}
          AWS_REGION:              ${{ vars.AWS_REGION }}
        run: |
          mvn --batch-mode clean verify \
            --settings .mvn/settings.xml
          echo "[INFO] Build and tests completed"

      - name: Deploy artifact to CodeArtifact
        env:
          CODEARTIFACT_AUTH_TOKEN: ${{ steps.codeartifact.outputs.token }}
          CODEARTIFACT_DOMAIN:     ${{ vars.CODEARTIFACT_DOMAIN }}
          CODEARTIFACT_OWNER:      ${{ steps.codeartifact.outputs.domain_owner }}
          AWS_REGION:              ${{ vars.AWS_REGION }}
          CODEARTIFACT_REPO:       ${{ steps.meta.outputs.codeartifact_repo }}
        run: |
          mvn --batch-mode deploy \
            --settings .mvn/settings.xml \
            -DskipTests
          echo "[INFO] Deployed to ${CODEARTIFACT_REPO}"

      - name: Authenticate to Amazon ECR
        run: |
          aws ecr get-login-password \
            --region "${{ vars.AWS_REGION }}" \
          | docker login \
            --username AWS \
            --password-stdin \
            "${{ vars.ECR_REGISTRY }}"

      - name: Build and push Docker image
        env:
          ECR_REPO:  ${{ steps.meta.outputs.ecr_repo }}
          IMAGE_TAG: ${{ steps.meta.outputs.image_tag }}
          VERSION:   ${{ steps.meta.outputs.version }}
        run: |
          docker build \
            --tag "${ECR_REPO}:${IMAGE_TAG}" \
            --tag "${ECR_REPO}:${ENV}-latest" \
            --label "git.sha=${{ github.sha }}" \
            --label "git.ref=${{ github.ref_name }}" \
            --label "env=${ENV}" \
            --label "version=${VERSION}" \
            .
          docker push "${ECR_REPO}:${IMAGE_TAG}"
          docker push "${ECR_REPO}:${ENV}-latest"
          echo "[INFO] Pushed ${ECR_REPO}:${IMAGE_TAG}"
  # ----------------------------------------------------------------------------
  # Job 3: Deploy via SSH to remote EC2 server
  # ----------------------------------------------------------------------------
  deploy:
    name: Deploy to ${{ needs.determine-env.outputs.env }} (${{ needs.determine-env.outputs.replicas }} replica(s))
    needs: [determine-env, build-and-publish]
    runs-on: ubuntu-latest
    environment: ${{ needs.determine-env.outputs.env }}
    env:
      ENV:          ${{ needs.build-and-publish.outputs.env }}
      REPLICAS:     ${{ needs.build-and-publish.outputs.replicas }}
      IMAGE_TAG:    ${{ needs.build-and-publish.outputs.image_tag }}
      VERSION:      ${{ needs.build-and-publish.outputs.version }}
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      # ── Step 1: Copy Docker Compose file to remote ─────────────────────────
      - name: Copy compose files to remote
        uses: appleboy/scp-action@v0.1.7
        with:
          host:     ${{ vars.SSH_HOST }}
          username: ${{ vars.SSH_USER }}
          key:      ${{ secrets.SSH_PRIVATE_KEY }}
          port:     22
          source:   "docker-compose.env.yml"
          target:   "/opt/af-novadesk-api/"

      # ── Step 2: Deploy on remote ────────────────────────────────────────────
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        envs:
          - ENV
          - REPLICAS
          - IMAGE_TAG
          - VERSION
        with:
          host:     ${{ vars.SSH_HOST }}
          username: ${{ vars.SSH_USER }}
          key:      ${{ secrets.SSH_PRIVATE_KEY }}
          port:     22
          envs:     ENV,REPLICAS,IMAGE_TAG,VERSION
          script: |
            set -euo pipefail

            COMPOSE_DIR="/opt/af-novadesk-api"
            ENV_FILE="/dev/shm/.env.${ENV}.${{ github.run_id }}"

            echo "============================================================"
            echo "  DEPLOYMENT SUMMARY"
            echo "============================================================"
            echo "  Environment: ${ENV^^}"
            echo "  Version:     ${VERSION}"
            echo "  Image Tag:   ${IMAGE_TAG}"
            echo "  Replicas:    ${REPLICAS}"
            echo "============================================================"

            # ── Create .env file in RAM (tmpfs /dev/shm) ──────────────────────
            echo "[INFO] Creating .env file in RAM (/dev/shm)..."
            install -m 600 /dev/null "${ENV_FILE}"
            cat > "${ENV_FILE}" <<- ENDOFENV
            ENV=${ENV}
            REPLICAS=${REPLICAS}
            ECR_REGISTRY=${{ vars.ECR_REGISTRY }}
            NOVADESK_TAG=${IMAGE_TAG}
            DOMAIN_SUFFIX=${{ vars.DOMAIN_SUFFIX }}
            CERT_RESOLVER=${{ vars.CERT_RESOLVER }}
            SERVER_PORT=${{ vars.SERVER_PORT }}
            SPRING_DATASOURCE_URL=${{ secrets.SPRING_DATASOURCE_URL }}
            POSTGRES_USER=${{ secrets.POSTGRES_USER }}
            POSTGRES_PASSWORD=${{ secrets.POSTGRES_PASSWORD }}
            SPRING_BOOT_ADMIN_URL=${{ vars.SPRING_BOOT_ADMIN_URL }}
            SBA_CLIENT_USERNAME=${{ secrets.SBA_CLIENT_USERNAME }}
            SBA_CLIENT_PASSWORD=${{ secrets.SBA_CLIENT_PASSWORD }}
            MINIO_URL=${{ secrets.MINIO_URL }}
            MINIO_ACCESS_KEY=${{ secrets.MINIO_ACCESS_KEY }}
            MINIO_SECRET_KEY=${{ secrets.MINIO_SECRET_KEY }}
            MINIO_BUCKET=${{ secrets.MINIO_BUCKET }}
            MINIO_REGION=${{ secrets.MINIO_REGION }}
            ENDOFENV
            echo "[INFO] .env file written to ${ENV_FILE} (RAM/tmpfs)"

            # ── Authenticate to ECR ───────────────────────────────────────────
            echo "[INFO] Authenticating to Amazon ECR..."
            aws ecr get-login-password \
              --region "${{ vars.AWS_REGION }}" \
            | docker login \
              --username AWS \
              --password-stdin \
              "${{ vars.ECR_REGISTRY }}"

            # ── Pull the Docker image ─────────────────────────────────────────
            echo "[INFO] Pulling image ${IMAGE_TAG} from ECR..."
            docker compose \
              -p "af-novadesk-${ENV}" \
              --env-file "${ENV_FILE}" \
              -f "${COMPOSE_DIR}/docker-compose.env.yml" \
              pull novadesk-api

            # ── Deploy ────────────────────────────────────────────────────────
            PROJECT_NAME="af-novadesk-${ENV}"
            COMPOSE_CMD="docker compose \
              -p ${PROJECT_NAME} \
              --env-file ${ENV_FILE} \
              -f ${COMPOSE_DIR}/docker-compose.env.yml"

            if [[ "${REPLICAS}" == "1" ]]; then
              echo "[INFO] Single replica mode - recreating container..."
              docker rm -f "af-novadesk-${ENV}-novadesk-api-1" 2>/dev/null || true
              ${COMPOSE_CMD} up -d --no-deps --force-recreate novadesk-api
              echo "[INFO] Deployed ${PROJECT_NAME}"
            else
              echo "[INFO] Multiple replica mode - rolling update..."
              ${COMPOSE_CMD} up -d --scale novadesk-api=${REPLICAS} --no-recreate novadesk-api
              echo "[INFO] Rolling update initiated"
            fi

      # ── Step 3: Health check on remote ──────────────────────────────────────
      - name: Verify deployment health
        uses: appleboy/ssh-action@v1.0.3
        envs:
          - ENV
          - REPLICAS
        with:
          host:     ${{ vars.SSH_HOST }}
          username: ${{ vars.SSH_USER }}
          key:      ${{ secrets.SSH_PRIVATE_KEY }}
          port:     22
          envs:     ENV,REPLICAS
          script: |
            set -euo pipefail

            echo "[INFO] Waiting for all replicas to become healthy (max 180s)..."
            MAX_ATTEMPTS=36
            INTERVAL=5

            for attempt in $(seq 1 ${MAX_ATTEMPTS}); do
              echo ""
              echo "Attempt ${attempt}/${MAX_ATTEMPTS}:"

              HEALTHY_COUNT=0
              UNHEALTHY_CONTAINERS=()

              for i in $(seq 1 ${REPLICAS}); do
                CONTAINER="af-novadesk-${ENV}-novadesk-api-${i}"

                if ! docker ps -a --format '{{.Names}}' | grep -q "^${CONTAINER}$"; then
                  echo "  [MISSING] ${CONTAINER}: not found"
                  UNHEALTHY_CONTAINERS+=("${CONTAINER}")
                  continue
                fi

                STATE=$(docker inspect --format='{{.State.Status}}' "${CONTAINER}" 2>/dev/null || echo "missing")

                if [[ "${STATE}" == "running" ]]; then
                  HEALTH=$(docker inspect --format='{{if .State.Health}}{{.State.Health.Status}}{{else}}no-healthcheck{{end}}' "${CONTAINER}" 2>/dev/null || echo "unknown")

                  if [[ "${HEALTH}" == "healthy" ]]; then
                    echo "  [OK] ${CONTAINER}: healthy"
                    HEALTHY_COUNT=$((HEALTHY_COUNT + 1))
                  elif [[ "${HEALTH}" == "starting" ]]; then
                    echo "  [WAIT] ${CONTAINER}: starting..."
                    UNHEALTHY_CONTAINERS+=("${CONTAINER}")
                  else
                    echo "  [WARN] ${CONTAINER}: ${HEALTH}"
                    UNHEALTHY_CONTAINERS+=("${CONTAINER}")
                  fi
                elif [[ "${STATE}" == "restarting" ]]; then
                  echo "  [WARN] ${CONTAINER}: restarting"
                  UNHEALTHY_CONTAINERS+=("${CONTAINER}")
                elif [[ "${STATE}" == "exited" ]]; then
                  EXIT_CODE=$(docker inspect --format='{{.State.ExitCode}}' "${CONTAINER}")
                  echo "  [ERROR] ${CONTAINER}: exited (exit code: ${EXIT_CODE})"
                  UNHEALTHY_CONTAINERS+=("${CONTAINER}")
                else
                  echo "  [WARN] ${CONTAINER}: ${STATE}"
                  UNHEALTHY_CONTAINERS+=("${CONTAINER}")
                fi
              done

              echo ""
              echo "Summary: ${HEALTHY_COUNT}/${REPLICAS} replicas healthy"

              if [[ ${HEALTHY_COUNT} -eq ${REPLICAS} ]]; then
                echo ""
                echo "[OK] All ${REPLICAS} replica(s) are healthy!"
                exit 0
              fi

              if [[ ${attempt} -eq ${MAX_ATTEMPTS} ]]; then
                echo ""
                echo "[ERROR] Health check timed out after ${MAX_ATTEMPTS} attempts"
                echo ""
                echo "Unhealthy containers:"
                for container in "${UNHEALTHY_CONTAINERS[@]}"; do
                  echo "  - ${container}"
                done
                echo ""
                echo "Dumping logs from unhealthy containers:"
                for container in "${UNHEALTHY_CONTAINERS[@]}"; do
                  if docker ps -a --format '{{.Names}}' | grep -q "^${container}$"; then
                    echo ""
                    echo "─────────────────────────────────────────────────────────"
                    echo "Logs for ${container}:"
                    echo "─────────────────────────────────────────────────────────"
                    docker logs --tail 100 "${container}" || true
                  fi
                done
                exit 1
              fi

              sleep ${INTERVAL}
            done

      # ── Step 4: Cleanup .env file from RAM (tmpfs) on remote ──────────────
      - name: Cleanup remote env file from RAM
        if: always()
        uses: appleboy/ssh-action@v1.0.3
        envs:
          - ENV
        with:
          host:     ${{ vars.SSH_HOST }}
          username: ${{ vars.SSH_USER }}
          key:      ${{ secrets.SSH_PRIVATE_KEY }}
          port:     22
          envs:     ENV
          script: |
            rm -f "/dev/shm/.env.${ENV}.${{ github.run_id }}"
            echo "[INFO] Cleaned up .env.${ENV} from /dev/shm (RAM)"
