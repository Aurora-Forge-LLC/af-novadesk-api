name: Init Database
# -----------------------------------------------------------------------------
# One-time initialization: creates the af_novadesk database in the shared
# infra postgres instance for the target environment.
#
# The postgres superuser is already created by af-infra-core.
# This workflow creates the dedicated 'af_novadesk' database so Flyway
# can connect and run migrations on the first deploy.
#
# Prerequisites (GitHub Environment secrets/variables):
#   - SSH_HOST          (Variable)  - EC2 server hostname/IP
#   - SSH_USER          (Variable)  - SSH username
#   - SSH_PRIVATE_KEY   (Secret)    - EC2 private key
#   - POSTGRES_USER     (Secret)    - Postgres superuser name
#   - POSTGRES_PASSWORD (Secret)    - Postgres superuser password
# -----------------------------------------------------------------------------
on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target environment'
        required: true
        type: choice
        options:
          - dit
          - sit
permissions:
  contents: read
jobs:
  init-db:
    name: Initialize NovaDesk Database
    runs-on: [self-hosted, linux, ap-south-1]
    environment: ${{ inputs.environment }}
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Copy init script to EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host:     ${{ vars.SSH_HOST }}
          username: ${{ vars.SSH_USER }}
          key:      ${{ secrets.SSH_PRIVATE_KEY }}
          source:   scripts/init-db.sh
          target:   /tmp/af-novadesk-api/
      - name: Run DB init script on EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host:     ${{ vars.SSH_HOST }}
          username: ${{ vars.SSH_USER }}
          key:      ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            chmod +x /tmp/af-novadesk-api/scripts/init-db.sh
            ENV=${{ inputs.environment }} \
            POSTGRES_USER="${{ secrets.POSTGRES_USER }}" \
            POSTGRES_PASSWORD="${{ secrets.POSTGRES_PASSWORD }}" \
            /tmp/af-novadesk-api/scripts/init-db.sh
            rm -rf /tmp/af-novadesk-api
      - name: Success notification
        run: |
          echo "Database schema initialized for ${{ inputs.environment }}"
          echo ""
          echo "Next step: Deploy af-novadesk-api via the Deploy workflow"
