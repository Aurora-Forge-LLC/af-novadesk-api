# =============================================================
# Publish — Maven Deploy → Docker Build → Nexus Push
# Triggered on push to develop / main
# Docker tags are derived from the Maven version in pom.xml:
#   1.0.0  →  1.0.0,  latest
# =============================================================

name: Publish

on:
  push:
    branches: [ develop, main, master ]
  workflow_dispatch:

env:
  NEXUS_DOCKER_HOST: registry.auroraforge.co
  IMAGE_NAME: registry.auroraforge.co/af-docker/af-novadesk-api

jobs:

  # -------------------------------------------------------------
  # Single job: Maven Build → Nexus Deploy → Docker Build & Push
  # Both steps run on the same self-hosted runner so the fat JAR
  # built by Maven is available in target/ for the Docker build
  # without any artifact upload/download.
  # -------------------------------------------------------------
  publish:
    name: Maven Build & Docker Publish
    runs-on: self-hosted

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Extract Maven Version
        id: version
        env:
          NEXUS_USERNAME: ${{ secrets.NEXUS_USERNAME }}
          NEXUS_PASSWORD: ${{ secrets.NEXUS_PASSWORD }}
        run: |
          MVN_VERSION=$(mvn help:evaluate -Dexpression=project.version -q -DforceStdout --settings .mvn/settings.xml)
          echo "maven-version=${MVN_VERSION}" >> $GITHUB_OUTPUT
          echo "Maven version: ${MVN_VERSION}"

      # Builds both the thin JAR and the fat boot JAR locally.
      - name: Maven — Build JARs
        env:
          NEXUS_USERNAME: ${{ secrets.NEXUS_USERNAME }}
          NEXUS_PASSWORD: ${{ secrets.NEXUS_PASSWORD }}
        run: |
          mvn clean package -B -DskipTests \
            --settings .mvn/settings.xml

      # Deploy ONLY the thin JAR + POM to Nexus.
      # Fat JARs are not useful as Maven dependencies and risk 413 errors.
      - name: Maven — Deploy thin JAR to Nexus
        env:
          NEXUS_USERNAME: ${{ secrets.NEXUS_USERNAME }}
          NEXUS_PASSWORD: ${{ secrets.NEXUS_PASSWORD }}
        run: |
          MVN_VER="${{ steps.version.outputs.maven-version }}"
          mvn deploy:deploy-file \
            -DgroupId=com.af.infra.core \
            -DartifactId=af-novadesk-api \
            -Dversion="${MVN_VER}" \
            -Dpackaging=jar \
            -Dfile="target/af-novadesk-api-${MVN_VER}.jar" \
            -DpomFile=pom.xml \
            -DrepositoryId=af-snapshots \
            -Durl="https://nexus.auroraforge.co/repository/af-snapshots/" \
            --settings .mvn/settings.xml

      - name: Docker Login — Nexus Registry
        run: |
          echo "${{ secrets.NEXUS_DOCKERPASSWORD }}" | \
          docker login "${{ env.NEXUS_DOCKER_HOST }}" \
            -u "${{ secrets.NEXUS_DOCKERUSER }}" \
            --password-stdin

      # target/*-boot.jar was built above and is still present on this runner.
      - name: Docker Build
        run: |
          docker build \
            -t ${{ env.IMAGE_NAME }}:${{ steps.version.outputs.maven-version }} \
            -t ${{ env.IMAGE_NAME }}:latest \
            .

      - name: Docker Push
        run: |
          docker push ${{ env.IMAGE_NAME }}:${{ steps.version.outputs.maven-version }}
          docker push ${{ env.IMAGE_NAME }}:latest

      - name: Summary
        run: |
          echo "=============================================="
          echo " Published af-novadesk-api"
          echo "=============================================="
          echo " Version   -> ${{ steps.version.outputs.maven-version }}"
          echo " Image     -> ${{ env.IMAGE_NAME }}:${{ steps.version.outputs.maven-version }}"
          echo "             ${{ env.IMAGE_NAME }}:latest"
          echo " JAR       -> https://nexus.auroraforge.co/repository/af-snapshots/"
          echo "=============================================="
