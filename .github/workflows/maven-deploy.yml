name: Deploy Snapshot
# Deploys SNAPSHOTs to CodeArtifact on every push to main.
on:
  push:
    branches:
      - main
permissions:
  contents: read
jobs:
  deploy:
    name: Maven Deploy
    runs-on: [self-hosted, linux, ap-south-1]
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set JAVA_HOME to Corretto 25
        run: |
          for candidate in /usr/lib/jvm/java-25-amazon-corretto \
                           /usr/lib/jvm/java-25-amazon-corretto.x86_64 \
                           /opt/java/25; do
            if [ -x "${candidate}/bin/java" ]; then
              JAVA_HOME="${candidate}"
              break
            fi
          done
          echo "JAVA_HOME=${JAVA_HOME}" >> "$GITHUB_ENV"
          echo "PATH=${JAVA_HOME}/bin:$PATH" >> "$GITHUB_ENV"
          ${JAVA_HOME}/bin/java -version
      - name: Fetch CodeArtifact auth token
        id: codeartifact
        run: |
          TOKEN=$(aws codeartifact get-authorization-token \
            --domain "${{ secrets.CODEARTIFACT_DOMAIN }}" \
            --domain-owner "${{ secrets.CODEARTIFACT_OWNER }}" \
            --region "${{ secrets.AWS_REGION }}" \
            --query authorizationToken \
            --output text)
          echo "token=$TOKEN" >> "$GITHUB_OUTPUT"
      - name: Maven deploy
        env:
          CODEARTIFACT_AUTH_TOKEN: ${{ steps.codeartifact.outputs.token }}
          CODEARTIFACT_DOMAIN: ${{ secrets.CODEARTIFACT_DOMAIN }}
          CODEARTIFACT_OWNER: ${{ secrets.CODEARTIFACT_OWNER }}
          AWS_REGION: ${{ secrets.AWS_REGION }}
          CODEARTIFACT_REPO: af-snapshots
        run: |
          mvn --batch-mode deploy \
            --settings .mvn/settings.xml \
            -DskipTests
      - name: Extract Maven version
        id: meta
        env:
          CODEARTIFACT_AUTH_TOKEN: ${{ steps.codeartifact.outputs.token }}
          CODEARTIFACT_DOMAIN: ${{ secrets.CODEARTIFACT_DOMAIN }}
          CODEARTIFACT_OWNER: ${{ secrets.CODEARTIFACT_OWNER }}
          AWS_REGION: ${{ secrets.AWS_REGION }}
        run: |
          VERSION=$(mvn help:evaluate -Dexpression=project.version -q -DforceStdout --settings .mvn/settings.xml)
          echo "image_tag=${VERSION}"                                            >> "$GITHUB_OUTPUT"
          echo "ecr_repo=${{ secrets.ECR_REGISTRY }}/af-novadesk-api"           >> "$GITHUB_OUTPUT"
          echo "Maven version: $VERSION"
      - name: Login to Amazon ECR
        run: |
          aws ecr get-login-password \
            --region "${{ secrets.AWS_REGION }}" \
          | docker login \
            --username AWS \
            --password-stdin \
            "${{ secrets.ECR_REGISTRY }}"
      - name: Build and push Docker image
        env:
          ECR_REPO: ${{ steps.meta.outputs.ecr_repo }}
          IMAGE_TAG: ${{ steps.meta.outputs.image_tag }}
        run: |
          docker build \
            --tag "${ECR_REPO}:${IMAGE_TAG}" \
            --tag "${ECR_REPO}:latest" \
            --label "git.sha=${{ github.sha }}" \
            --label "git.ref=${GITHUB_REF_NAME}" \
            .
          docker push "${ECR_REPO}:${IMAGE_TAG}"
          docker push "${ECR_REPO}:latest"
          echo "Pushed ${ECR_REPO}:${IMAGE_TAG}"
