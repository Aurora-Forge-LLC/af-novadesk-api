name: Build
on:
  push:
    branches:
      - develop
      - main
  pull_request:
    branches:
      - develop
      - main
permissions:
  contents: read
jobs:
  build:
    name: Maven Build
    runs-on: self-hosted
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set JAVA_HOME to Corretto 25
        run: |
          for candidate in /usr/lib/jvm/java-25-openjdk-amd64 \
                           /usr/lib/jvm/java-25-amazon-corretto \
                           /usr/lib/jvm/java-25-amazon-corretto.x86_64 \
                           /opt/java/25; do
            if [ -x "${candidate}/bin/java" ]; then
              JAVA_HOME="${candidate}"
              break
            fi
          done
          if [ -z "${JAVA_HOME:-}" ]; then
            echo "ERROR: No JDK 25 found in searched paths" >&2
            exit 1
          fi
          echo "JAVA_HOME=${JAVA_HOME}" >> "$GITHUB_ENV"
          echo "PATH=${JAVA_HOME}/bin:$PATH" >> "$GITHUB_ENV"
          echo "JAVA_HOME set to ${JAVA_HOME}"
          ${JAVA_HOME}/bin/java -version
      - name: Fetch CodeArtifact auth token
        id: codeartifact
        env:
          CODEARTIFACT_DOMAIN: ${{ vars.CODEARTIFACT_DOMAIN }}
          CODEARTIFACT_OWNER: ${{ vars.CODEARTIFACT_OWNER }}
          AWS_REGION: ${{ vars.AWS_REGION }}
        run: |
          set -euo pipefail
          [ -n "${CODEARTIFACT_DOMAIN:-}" ] || { echo "Missing CODEARTIFACT_DOMAIN"; exit 1; }
          [ -n "${AWS_REGION:-}" ] || { echo "Missing AWS_REGION"; exit 1; }
          DOMAIN_OWNER="${CODEARTIFACT_OWNER:-}"
          if [ -z "${DOMAIN_OWNER}" ]; then
            DOMAIN_OWNER=$(aws sts get-caller-identity --query Account --output text)
          fi
          TOKEN=$(aws codeartifact get-authorization-token \
            --domain "${CODEARTIFACT_DOMAIN}" \
            --domain-owner "${DOMAIN_OWNER}" \
            --region "${AWS_REGION}" \
            --query authorizationToken \
            --output text)
          echo "domain_owner=${DOMAIN_OWNER}" >> "$GITHUB_OUTPUT"
          echo "token=$TOKEN" >> "$GITHUB_OUTPUT"
      - name: Maven build
        env:
          CODEARTIFACT_AUTH_TOKEN: ${{ steps.codeartifact.outputs.token }}
          CODEARTIFACT_DOMAIN: ${{ vars.CODEARTIFACT_DOMAIN }}
          CODEARTIFACT_OWNER: ${{ steps.codeartifact.outputs.domain_owner }}
          AWS_REGION: ${{ vars.AWS_REGION }}
        run: |
          mvn --batch-mode verify \
            --settings .mvn/settings.xml
      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports-${{ github.run_id }}
          path: target/surefire-reports/
          if-no-files-found: ignore
          retention-days: 3
      - name: Extract Maven version
        id: maven_version
        env:
          CODEARTIFACT_AUTH_TOKEN: ${{ steps.codeartifact.outputs.token }}
          CODEARTIFACT_DOMAIN: ${{ vars.CODEARTIFACT_DOMAIN }}
          CODEARTIFACT_OWNER: ${{ steps.codeartifact.outputs.domain_owner }}
          AWS_REGION: ${{ vars.AWS_REGION }}
        run: |
          VERSION=$(mvn help:evaluate -Dexpression=project.version -q -DforceStdout --settings .mvn/settings.xml)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Maven version: $VERSION"
      - name: Docker build (validate)
        run: |
          docker build \
            --tag af-novadesk-api:${{ steps.maven_version.outputs.version }} \
            --label "git.sha=${{ github.sha }}" \
            --label "git.ref=${{ github.ref_name }}" \
            .
          
          
