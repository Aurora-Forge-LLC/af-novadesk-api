name: PR Build

on:
  pull_request:
    branches: [ develop, main, master ]

jobs:
  build:
    name: Compile & Test (Java 25)
    runs-on: self-hosted

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Maven — Compile & Test
        env:
          NEXUS_USERNAME: ${{ secrets.NEXUS_USERNAME }}
          NEXUS_PASSWORD: ${{ secrets.NEXUS_PASSWORD }}
        run: mvn clean verify -B -U --settings .mvn/settings.xml
