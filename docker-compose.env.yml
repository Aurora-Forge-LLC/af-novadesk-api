# -----------------------------------------------------------------------------
# AF NovaDesk API � Generic Environment Docker Compose
#
# Deployed by .github/workflows/deploy.yml for any environment (dit/sit/prod).
# Supports rolling deployments with configurable instance count.
#
# Infrastructure services (postgres, redis, rabbitmq, etc.) are managed
# separately by af-infra-core. This file only defines the af-novadesk-api
# application container(s).
#
# Usage (run by CI — do not run manually unless debugging):
#   ENV=dit REPLICAS=1 docker compose \
#     -p af-novadesk-dit \
#     --env-file /dev/shm/.env.dit \
#     -f docker-compose.env.yml \
#     up -d --scale novadesk-api=${REPLICAS}
#
# Container naming follows Docker Compose convention: {project}-{service}-{index}
#   DIT (1 replica):  af-novadesk-dit-novadesk-api-1
#   SIT (2 replicas): af-novadesk-sit-novadesk-api-1, af-novadesk-sit-novadesk-api-2
# -----------------------------------------------------------------------------
networks:
  af-core:
    name: af-core-${ENV}   # created and owned by af-infra-core � never recreated here
    external: true
services:
  # ---------------------------------------------------------------------------
  # AF NovaDesk API — Generic environment instance(s)
  # https://novadesk-api.${ENV}.auroraforge.co
  #
  # Supports 1-N replicas for rolling deployments.
  # Traefik automatically load-balances across all healthy instances.
  # ---------------------------------------------------------------------------
  novadesk-api:
    image: ${ECR_REGISTRY}/af-novadesk-api:${NOVADESK_TAG}
    restart: unless-stopped
    deploy:
      replicas: ${REPLICAS:-1}
      update_config:
        parallelism: 1
        delay: 30s
        failure_action: rollback
        order: start-first
      rollback_config:
        parallelism: 1
        delay: 10s
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
        window: 120s
    environment:
      # Dynamic profile activation based on environment
      SPRING_PROFILES_ACTIVE:            ${ENV}
      # Server port — resolves server.port: ${SERVER_PORT} in application.yml
      SERVER_PORT:                       ${SERVER_PORT}
      # Database — resolves ${SPRING_DATASOURCE_*} in application.yml
      SPRING_DATASOURCE_URL:             ${SPRING_DATASOURCE_URL}
      SPRING_DATASOURCE_USERNAME:        ${POSTGRES_USER}
      SPRING_DATASOURCE_PASSWORD:        ${POSTGRES_PASSWORD}
      # Spring Boot Admin — resolves ${SPRING_BOOT_ADMIN_URL} in profile ymls
      SPRING_BOOT_ADMIN_URL:             ${SPRING_BOOT_ADMIN_URL}
      SPRING_BOOT_ADMIN_CLIENT_USERNAME: ${SBA_CLIENT_USERNAME}
      SPRING_BOOT_ADMIN_CLIENT_PASSWORD: ${SBA_CLIENT_PASSWORD}

      # MinIO/S3 object storage — resolves ${MINIO_*} in application.yml
      MINIO_URL:                       ${MINIO_URL}
      MINIO_ACCESS_KEY:                ${MINIO_ACCESS_KEY}
      MINIO_SECRET_KEY:                ${MINIO_SECRET_KEY}
      MINIO_BUCKET:                    ${MINIO_BUCKET}
      MINIO_REGION:                    ${MINIO_REGION}

      # AuthHub JWT validation — resolves ${AUTHHUB_JWK_SET_URI} and ${AUTHHUB_ISSUER_URI}
      # in application-dit.yml / application-sit.yml
      #
      # JWK Set URI: Use internal Docker networking (HTTP) to fetch signing keys.
      # This avoids SSL certificate trust issues with Traefik's Let's Encrypt certs.
      # Container name pattern: af-authhub-{env}-authhub-{index}
      # AuthHub listens on port 8081 internally (SERVER_PORT defaults to 8081 in dit/sit profiles)
      AUTHHUB_JWK_SET_URI:              http://af-authhub-${ENV}-authhub-1:8081/.well-known/jwks.json
      #
      # Issuer URI: Must match the 'iss' claim in JWT tokens issued by AuthHub.
      # This is the public HTTPS URL because existing tokens have iss=https://authhub.{domain}
      # and new tokens will also use this value (set via JWT_ISSUER_URI in authhub's config).
      AUTHHUB_ISSUER_URI:               https://authhub.${DOMAIN_SUFFIX}

      # AuthHub REST client base URL — used by AuthHubClientService to call authhub's
      # admin user creation API during employee onboarding.
      # Container name pattern: af-authhub-{env}-authhub-{index}
      # Override with AUTHHUB_INTERNAL_PORT env var if authhub uses a non-default port.
      AUTHHUB_BASE_URL:                  http://af-authhub-${ENV}-authhub-1:${AUTHHUB_INTERNAL_PORT:-8081}

      # OpenAPI / Swagger UI — server URL shown in Swagger UI for this environment
      APP_BASE_URL:                      https://novadesk-api.${DOMAIN_SUFFIX}/novadesk-api

    networks:
      - af-core
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/novadesk-api/actuator/health/liveness 2>/dev/null | grep -q UP"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    labels:
      - traefik.enable=true
      - traefik.docker.network=af-core-${ENV}
      - traefik.http.routers.novadesk-api-${ENV}.rule=Host(`novadesk-api.${DOMAIN_SUFFIX}`)
      - traefik.http.routers.novadesk-api-${ENV}.entrypoints=websecure
      - traefik.http.routers.novadesk-api-${ENV}.tls=true
      - traefik.http.routers.novadesk-api-${ENV}.tls.certresolver=${CERT_RESOLVER:-letsencrypt}
      - traefik.http.services.novadesk-api-${ENV}.loadbalancer.server.port=${SERVER_PORT:-8080}
      - traefik.http.services.novadesk-api-${ENV}.loadbalancer.healthcheck.path=/novadesk-api/actuator/health/readiness
      - traefik.http.services.novadesk-api-${ENV}.loadbalancer.healthcheck.interval=10s
