spring:
  application:
    name: af-novadesk-api

  security:
    oauth2:
      resourceserver:
        jwt:
          # AuthHub exposes its public signing key here.
          # Spring fetches this ONCE on startup and refreshes periodically.
          # Format: <authhub-host><authhub-context-path><jwks-endpoint>
          jwk-set-uri: ${AUTHHUB_JWK_SET_URI}   # e.g. http://af-authhub/auth/.well-known/jwks.json

          # Must match app.jwt.issuer-uri in af-authhub's config.
          # Spring rejects any token whose 'iss' claim does not match.
          issuer-uri: ${AUTHHUB_ISSUER_URI}      # e.g. http://af-authhub/auth

  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
    driver-class-name: org.postgresql.Driver

  flyway:
    enabled: true
    baseline-on-migrate: false
    locations: classpath:db/migration
    schemas: af_novadesk,af_novadesk_outbox
    default-schema: af_novadesk
    validate-on-migrate: true
    out-of-order: true
    ignore-migration-patterns: "*:missing"
    clean-disabled: true
    repair-on-migrate: false

  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    show-sql: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_schema: af_novadesk
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
      leak-detection-threshold: 60000
      pool-name: NovaDeskHikariPool

  jackson:
    serialization:
      write-dates-as-timestamps: false
      indent-output: true

  boot:
    admin:
      client:
        url: ${SPRING_BOOT_ADMIN_URL}
        username: ${SPRING_BOOT_ADMIN_CLIENT_USERNAME}
        password: ${SPRING_BOOT_ADMIN_CLIENT_PASSWORD}
        instance:
          prefer-ip: true
management:
  server:
    port: ${SERVER_PORT}
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
      base-path: /actuator
  endpoint:
    env:
      keys-to-sanitize: secret-key,secret,password
    health:
      show-details: always
      show-components: always
      probes:
        enabled: true
      group:
        liveness:
          include: livenessState,ping,diskSpace
        readiness:
          include: readinessState,db
    info:
      enabled: true
  info:
    build:
      enabled: true
    git:
      enabled: true
      mode: full
    java:
      enabled: true
    os:
      enabled: true
    env:
      enabled: true
  metrics:
    export:
      prometheus:
        enabled: true
  health:
    circuitbreakers:
      enabled: false
    minio:
      enabled: true
info:
  application:
    name: ${spring.application.name}
    version: "@project.version@"
    description: "AF NovaDesk API"
  build:
    timestamp: "@maven.build.timestamp@"
    java-version: "@java.version@"
server:
  port: ${SERVER_PORT}
  servlet:
    context-path: /novadesk-api
logging:
  level:
    root: INFO

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    config-url: /novadesk-api/v3/api-docs/swagger-config
    url: /novadesk-api/v3/api-docs
    operations-sorter: method
    tags-sorter: alpha
    display-request-duration: true
    disable-swagger-default-url: true
  show-actuator: false

finance:
  funding:
    reporting-currency: USD
    exchange-rate-lookback-days: 7
    max-manual-exchange-rate: 10000

app:
  openapi:
    server-url: ${APP_BASE_URL}
  cors:
    allowed-origins: "http://localhost:4200,http://localhost:3000"

  jwt:
    # Must match app.jwt.audience in af-authhub's config.
    # Spring Security rejects tokens whose 'aud' claim does not include this value,
    # preventing token replay attacks across services.
    audience: af-authhub-client

    outbox:
      # How many PENDING rows the poller picks up per batch
      batch-size: 50
      # Max delivery attempts before a row is marked DEAD
      max-retries: 5
      # Initial back-off delay in seconds; doubles on each retry (exponential)
      retry-backoff-seconds: 30

  authhub:
    # Base URL for af-authhub service (used by AuthHubClientService to create users)
    base-url: ${AUTHHUB_BASE_URL}

  # ── MinIO / S3-compatible Object Storage ──────────────────────────────────
  minio:
    url: ${MINIO_URL}
    access-key: ${MINIO_ACCESS_KEY}
    secret-key: ${MINIO_SECRET_KEY}
    bucket: ${MINIO_BUCKET}
    region: ${MINIO_REGION}
